
[tool.pytest.ini_options]
pythonpath = ["src/"]
testpaths = "tests"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S", "C90", "B", "UP", "ANN", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "N"]

[tool.ty.src]
include = ["src", "tests"]

[build-system]
requires = ["setuptools >= 40.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-big-batteries-project"
version = "0.0.1"
description = "An example BSGIP app"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "ijson>=3.5.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = ["bandit", "ty", "ruff", "codespell", "coverage", "pytest-cov"]
docs = ["sphinx", "sphinx-click", "sphinx-markdown-builder"]
test = ["pytest", "pytest-xdist"]

[tool.setuptools.package-data]
"my_app" = ["py.typed"]
